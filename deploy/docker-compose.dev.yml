# Local override so the repo's own stack can exercise the login (release2-plan §7 E5b). NEVER use it on the app VPS:
# it turns off the production startup policy and points the Origin guard at a plain-http loopback address.
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.dev.yml up --build
services:
  web:
    environment:
      OCR_ENV: development
      # loadWebConfig demands an https origin in production; the dev stack is served over loopback http.
      OCR_PUBLIC_BASE_URL: http://127.0.0.1:53100
      # Matches deploy/sql/seed-dev-tenant.sql, which has to be applied once on a fresh database.
      OCR_WEB_TENANT_ID: 00000000-0000-4000-8000-000000000001
      OCR_TRUSTED_PROXY_HOPS: 0
